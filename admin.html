<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artistry Alchemy — Studio Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><style>:root{--bg:#111;--paper:#ebe9e3;--muted:#9b9992;--line:#343434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Manrope,sans-serif}.page{max-width:1100px;margin:auto;padding:35px 5vw 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font:500 11px/1.1 'DM Mono';letter-spacing:.12em}.brand b{font:500 25px 'Playfair Display';letter-spacing:0}.top a,button{font:500 10px 'DM Mono';letter-spacing:.09em;text-transform:uppercase;border:1px solid #777;background:transparent;color:var(--paper);padding:11px 13px;text-decoration:none;cursor:pointer}.screen{max-width:480px;margin:14vh auto}.screen h1,.dashboard h1{font:500 clamp(42px,6vw,68px)/.95 'Playfair Display';letter-spacing:-.05em;margin:15px 0}.eyebrow{font:400 10px 'DM Mono';letter-spacing:.13em;color:var(--muted);text-transform:uppercase}p{line-height:1.7;color:#b7b5af;font-size:13px}.login-form,.form{display:grid;gap:12px;margin-top:28px}input,textarea,select{background:#191919;border:1px solid #414141;color:#eee;padding:13px;font:400 13px Manrope;width:100%}textarea{min-height:150px;resize:vertical}.primary{background:var(--paper);color:#111;border-color:var(--paper)}.notice{border-left:1px solid #aaa;padding:11px 15px;background:#171717;font-size:12px}.dashboard{display:none}.dashboard.show{display:block}.dash-head{display:flex;justify-content:space-between;align-items:end;margin:70px 0 30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.art-list{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:50px}.art-list article{border:1px solid var(--line);padding:12px}.art-list img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1)}.art-list h3{margin:9px 0 4px;font:500 23px 'Playfair Display'}.art-list p{font:10px 'DM Mono';margin:0}@media(max-width:600px){.form-grid,.art-list{grid-template-columns:1fr}.page{padding:23px 6vw}.dash-head{display:block;margin-top:45px}.dash-head button{margin-top:15px}}</style></head><body><div class="page"><header class="top"><div class="brand"><b>A</b><br>ARTISTRY ALCHEMY<br>STUDIO ADMIN</div><a href="index.html">View website ↗</a></header><section id="login" class="screen"><p class="eyebrow">Private studio access</p><h1>Welcome back.</h1><p>Sign in to add original works to the public gallery.</p><div id="configNote" class="notice">Connect Supabase first: add the Project URL and anon key to <code>supabase-config.js</code>.</div><form id="loginForm" class="login-form"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="primary">Sign in ↗</button></form><p id="loginMessage"></p></section><section id="dashboard" class="dashboard"><div class="dash-head"><div><p class="eyebrow">Collection manager</p><h1>Add an artwork.</h1></div><button id="logout">Sign out</button></div><form id="artForm" class="form"><div class="form-grid"><input id="title" placeholder="Artwork title *" required><input id="category" placeholder="Category (e.g. Figurative Art — Realism) *" required><input id="medium" placeholder="Medium"><input id="dimensions" placeholder="Size / dimensions"><input id="artYear" placeholder="Year (e.g. 2026)"><select id="status"><option>Available</option><option>Sold</option><option>Commission only</option></select><input class="full" id="image" type="file" accept="image/jpeg,image/png,image/webp" required><textarea class="full" id="description" placeholder="Artwork description"></textarea></div><button class="primary">Upload & publish artwork ↗</button><p id="formMessage"></p></form><div id="artList" class="art-list"></div></section></div><script src="vendor/supabase.min.js"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
